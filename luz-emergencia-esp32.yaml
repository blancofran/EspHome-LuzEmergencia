substitutions:
  name: luzemergencia-esp32
  friendly_name: Luz Emergencia (ESP32)
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.6.0
  name_add_mac_suffix: false
  project:
    name: esphome.web
    version: dev
esp32:
  board: esp32dev
  framework:
    type: arduino
# Enable logging
logger:
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key
# Allow Over-The-Air updates
ota:
- platform: esphome
# Allow provisioning Wi-Fi via serial
improv_serial:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Set up a wifi access point
  ap:
    ssid: "EspHome Luz Emergencia"
    password: !secret ap_password
# In combination with the `ap` this allows the user
# to provision wifi credentials to the device via WiFi AP.
captive_portal:
number:
  - platform: template
    name: "Retardo de apagado tras regreso de corriente"
    id: tiempo_apagado
    optimistic: true
    min_value: 10
    max_value: 1800
    step: 10
    initial_value: 300
    restore_value: true
    unit_of_measurement: s
    mode: box
    icon: "mdi:timer-outline"
  - platform: template
    name: "Retardo para encender"
    id: retardo_encendido
    optimistic: true
    min_value: 0
    max_value: 5000
    step: 50
    initial_value: 300
    restore_value: true
    unit_of_measurement: ms
    mode: box
    entity_category: config
    icon: "mdi:timer-outline"
switch:
  - platform: template
    name: "Permitir encendido diurno"
    id: permitir_diurno
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    icon: "mdi:weather-sunny"
  - platform: template
    name: "Encender al atardecer si hay corte"
    id: encender_en_atardecer
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    icon: "mdi:weather-sunset-down"
  - platform: gpio
    id: relay0
    name: "Luz Emergencia"
    pin:
      number: GPIO4
      inverted: false
    restore_mode: ALWAYS_OFF
sensor:
  - platform: adc
    pin: GPIO34
    attenuation: 11db
    id: volt
    update_interval: 2s
    internal: True
    filters:
      - multiply: 5
      - delta: 0.1
binary_sensor:
  - platform: template
    device_class: power
    name: "Electricidad"
    id: electricidad
    lambda: |-
      if (id(volt).state >= 0.5) {
       return true;
       } else {
       return false;
       }
  - platform: template
    device_class: problem
    name: "Sin Corriente"
    id: sincorriente
    internal: True
    filters:
      - delayed_off: !lambda "return id(tiempo_apagado).state * 1000;"
      - delayed_on: !lambda "return id(retardo_encendido).state;"

    on_state:
      then:
        - if:
            condition:
              and:
                - binary_sensor.is_on: sincorriente
                - or:
                    - sun.is_below_horizon
                    - switch.is_on: permitir_diurno
            then:
              - switch.turn_on: relay0
        - if:
            condition:
              - binary_sensor.is_off: sincorriente
            then:
              - switch.turn_off: relay0
    lambda: |-
      // true = no hay corriente (voltaje bajo)
      if (id(volt).state < 0.5) {
       return true;
       } else {
       return false;
       }

time:
  - platform: homeassistant
    id: homeassistant_time
  - platform: sntp

sun:
  latitude: !secret latitude
  longitude: !secret longitude
  id: sun_component
  on_sunset:
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: sincorriente
              - switch.is_on: encender_en_atardecer
              - switch.is_off: relay0
          then:
            - switch.turn_on: relay0

text_sensor:
  - platform: sun
    name: Próximo amanecer
    type: sunrise
    id: next_sunrise
    internal: True
  - platform: sun
    name: Próximo atardecer
    type: sunset
    id: next_sunset
    internal: True
