<svg viewBox="0 0 1180 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagrama de cableado: un adaptador de 5V alimenta un divisor resistivo R1/R2 con filtro C1 hacia el pin GPIO34 (ADC1) de un ESP32 DevKit. Un controlador de carga sellado, enchufado en la misma toma monitoreada, convierte AC a 12V y mantiene cargada una batería de respaldo de 12V. Esa batería alimenta todo el sistema, independiente del adaptador monitoreado: a través de un regulador step-down 5V energiza el ESP32 y el lado de control del relé (IN, VCC, GND), y directamente el contacto COM del relé; al conmutar hacia el contacto NO entrega los 12V a la luz de emergencia. El ESP32 controla el relé por GPIO4. Dentro del relé, los pines de control quedan separados por una línea de los contactos de conmutación. Todos los GND (adaptador, controlador de carga, ESP32, relé, batería y luz) están unidos por una referencia común.">
  <title>Cableado — Luz de Emergencia (ESP32, batería de respaldo 12V)</title>
  <rect x="0" y="0" width="1180" height="680" fill="#ffffff"/>

  <text x="20" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1f2328">Cableado — Luz de Emergencia (ESP32, batería 12V)</text>

  <!-- Adaptador 5V (sensor de la toma monitoreada) -->
  <rect x="40" y="60" width="180" height="90" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="130" y="98" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Adaptador 5V</text>
  <text x="130" y="116" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#57606a">(enchufado en la toma a</text>
  <text x="130" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#57606a">monitorear; no se cablea)</text>

  <!-- +5V pin from adaptador -->
  <line x1="95" y1="150" x2="95" y2="180" stroke="#1f2328" stroke-width="2"/>
  <text x="102" y="169" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328">+5V</text>

  <!-- GND pin from adaptador (accent) -->
  <line x1="175" y1="150" x2="175" y2="580" stroke="#0969da" stroke-width="2"/>
  <text x="182" y="169" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0969da">GND</text>

  <!-- Divider: R1 -->
  <rect x="87" y="180" width="16" height="36" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="115" y="193" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">R1</text>
  <text x="115" y="207" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">10 kΩ</text>

  <!-- Wire from R1 down to node A -->
  <line x1="95" y1="216" x2="95" y2="235" stroke="#1f2328" stroke-width="2"/>

  <!-- Node A (junction: R1 above / wire to ESP32 / R2 below / C1 tap) -->
  <circle cx="95" cy="235" r="3.5" fill="#1f2328"/>
  <line x1="95" y1="235" x2="480" y2="235" stroke="#1f2328" stroke-width="2"/>
  <circle cx="190" cy="235" r="3.5" fill="#1f2328"/>

  <!-- Wire from node A down to R2 -->
  <line x1="95" y1="235" x2="95" y2="245" stroke="#1f2328" stroke-width="2"/>

  <!-- R2 -->
  <rect x="87" y="245" width="16" height="36" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="115" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">R2</text>
  <text x="115" y="272" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">15 kΩ</text>
  <line x1="95" y1="281" x2="95" y2="580" stroke="#0969da" stroke-width="2"/>

  <!-- C1 (parallel branch tapped off the GPIO34 wire at the node-A dot) -->
  <line x1="190" y1="235" x2="190" y2="268" stroke="#1f2328" stroke-width="2"/>
  <line x1="180" y1="268" x2="200" y2="268" stroke="#1f2328" stroke-width="3"/>
  <line x1="180" y1="276" x2="200" y2="276" stroke="#1f2328" stroke-width="3"/>
  <line x1="190" y1="276" x2="190" y2="580" stroke="#0969da" stroke-width="2"/>
  <text x="212" y="266" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">C1</text>
  <text x="212" y="282" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">0.1 µF</text>

  <!-- Divider math (below GND bus, clear of wires) -->
  <text x="250" y="618" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328">V(GPIO34) = 5V × R2 / (R1 + R2)</text>
  <text x="250" y="636" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#57606a">= 5V × 15k / 25k = 3.0V (&lt; 3.3V máx.)</text>
  <text x="250" y="654" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">ESP32: agregar "attenuation: 11db" al sensor ADC en el YAML</text>

  <!-- Controlador de carga (AC -> 12V, mantiene la batería cargada; dispositivo sellado) -->
  <rect x="260" y="60" width="180" height="90" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="350" y="92" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Controlador de carga</text>
  <text x="350" y="108" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#57606a">(AC → 12V; enchufado en la</text>
  <text x="350" y="121" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#57606a">misma toma monitoreada)</text>
  <text x="350" y="137" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#57606a">mantiene la batería cargada</text>

  <!-- Controlador de carga: salida +12V hacia la batería -->
  <line x1="340" y1="150" x2="340" y2="465" stroke="#1f2328" stroke-width="2"/>
  <line x1="340" y1="465" x2="500" y2="465" stroke="#1f2328" stroke-width="2"/>
  <line x1="500" y1="465" x2="500" y2="470" stroke="#1f2328" stroke-width="2"/>
  <text x="345" y="435" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2328">+12V (carga)</text>

  <!-- Controlador de carga: GND -->
  <line x1="300" y1="150" x2="300" y2="580" stroke="#0969da" stroke-width="2"/>
  <text x="305" y="169" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0969da">GND</text>

  <!-- ESP32 DevKit -->
  <rect x="480" y="170" width="200" height="180" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="580" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">ESP32 DevKit</text>
  <text x="580" y="216" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#57606a">(board: esp32dev)</text>
  <text x="500" y="253" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" fill="#1f2328">GPIO34 (ADC1)</text>

  <!-- GPIO4 -> Relé IN -->
  <line x1="680" y1="235" x2="760" y2="235" stroke="#1f2328" stroke-width="2"/>
  <text x="685" y="253" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2328">GPIO4</text>
  <text x="755" y="253" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="end" fill="#1f2328">IN</text>

  <!-- ESP32 5V / VIN -->
  <line x1="530" y1="350" x2="530" y2="395" stroke="#1f2328" stroke-width="2"/>
  <text x="505" y="375" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2328">5V</text>

  <!-- ESP32 GND (routed left, around the Batería box) -->
  <line x1="630" y1="350" x2="630" y2="455" stroke="#0969da" stroke-width="2"/>
  <line x1="630" y1="455" x2="460" y2="455" stroke="#0969da" stroke-width="2"/>
  <line x1="460" y1="455" x2="460" y2="580" stroke="#0969da" stroke-width="2"/>
  <text x="640" y="372" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0969da">GND</text>

  <!-- Relé -->
  <rect x="760" y="170" width="160" height="140" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="840" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Relé</text>
  <text x="840" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#57606a">(módulo opto 5V)</text>

  <!-- Internal divider: control (izquierda) vs. contactos de conmutación (derecha) -->
  <line x1="855" y1="222" x2="855" y2="302" stroke="#57606a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="807" y="225" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#57606a">control</text>
  <text x="887" y="225" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#57606a">carga</text>

  <!-- Zona de CONTROL (5V): IN / VCC / GND -->
  <!-- IN ya entra por el borde izquierdo a y=235 -->

  <!-- Relé VCC <- salida 5V del regulador -->
  <line x1="790" y1="310" x2="790" y2="395" stroke="#1f2328" stroke-width="2"/>
  <line x1="790" y1="395" x2="680" y2="395" stroke="#1f2328" stroke-width="2"/>
  <text x="795" y="335" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2328">VCC</text>

  <!-- Relé GND -->
  <line x1="840" y1="310" x2="840" y2="580" stroke="#0969da" stroke-width="2"/>
  <text x="845" y="335" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#0969da">GND</text>

  <!-- Zona de CARGA (12V): COM / NO -->
  <!-- Relé NO -> Luz de emergencia (+) -->
  <line x1="920" y1="195" x2="980" y2="195" stroke="#1f2328" stroke-width="2"/>
  <text x="950" y="183" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2328">NO</text>

  <!-- Relé COM <- +12V directo de la batería (sin pasar por el regulador) -->
  <line x1="920" y1="245" x2="940" y2="245" stroke="#1f2328" stroke-width="2"/>
  <line x1="940" y1="245" x2="940" y2="430" stroke="#1f2328" stroke-width="2"/>
  <line x1="940" y1="430" x2="750" y2="430" stroke="#1f2328" stroke-width="2"/>
  <line x1="750" y1="430" x2="750" y2="470" stroke="#1f2328" stroke-width="2"/>
  <text x="925" y="262" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2328">COM</text>

  <!-- Regulador 5V (step-down 12V -> 5V, alimenta la lógica) -->
  <rect x="520" y="395" width="160" height="50" rx="6" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="600" y="415" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">Regulador 5V</text>
  <text x="600" y="430" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#57606a">(step-down 12V → 5V)</text>

  <!-- Regulador +12V input -->
  <line x1="600" y1="445" x2="600" y2="470" stroke="#1f2328" stroke-width="2"/>

  <!-- Batería de respaldo 12V -->
  <rect x="480" y="470" width="340" height="70" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="650" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2328">Batería de respaldo — 12V</text>
  <text x="650" y="518" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#57606a">alimenta el ESP32, relé y la luz de emergencia</text>
  <text x="650" y="532" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#57606a">— independiente del adaptador monitoreado</text>

  <!-- Batería GND -->
  <line x1="650" y1="540" x2="650" y2="580" stroke="#0969da" stroke-width="2"/>
  <text x="662" y="564" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#0969da">GND</text>

  <!-- Luz de emergencia (12V DC, conmutada por el relé) -->
  <rect x="980" y="170" width="160" height="90" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="1060" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Luz de</text>
  <text x="1060" y="218" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">emergencia</text>
  <text x="1060" y="234" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle" fill="#57606a">(12V DC)</text>

  <!-- Luz de emergencia GND/retorno a la batería -->
  <line x1="1060" y1="260" x2="1060" y2="580" stroke="#0969da" stroke-width="2"/>
  <text x="1070" y="400" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="start" fill="#0969da">GND</text>

  <!-- GND bus -->
  <line x1="70" y1="580" x2="1060" y2="580" stroke="#0969da" stroke-width="3"/>
  <text x="70" y="600" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#0969da">GND común</text>
  <circle cx="95" cy="580" r="3" fill="#0969da"/>
  <circle cx="175" cy="580" r="3" fill="#0969da"/>
  <circle cx="190" cy="580" r="3" fill="#0969da"/>
  <circle cx="300" cy="580" r="3" fill="#0969da"/>
  <circle cx="460" cy="580" r="3" fill="#0969da"/>
  <circle cx="650" cy="580" r="3" fill="#0969da"/>
  <circle cx="840" cy="580" r="3" fill="#0969da"/>
  <circle cx="1060" cy="580" r="3" fill="#0969da"/>
</svg>
